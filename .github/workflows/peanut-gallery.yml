name: Peanut Gallery Review

# Persona-driven PR review (charles8051/peanut-gallery). Runs on every push to a PR and on new
# PR comments, so a reviewer can answer the author (for example, withdraw a finding called out as
# intentional). Runs on a self-hosted ephemeral runner pool.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  statuses: write   # the peanut-gallery commit status (commit-status below)

# Serialize runs per PR instead of cancelling the older one. The action clean-exits a run whose
# head has moved on, and serialization keeps the panel comment single-writer.
concurrency:
  group: peanut-gallery-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    # pull_request: same-repo branches only. A fork PR runs the fork's copy of this file, so this
    # half is hygiene, not a boundary. The boundary is Settings -> Actions, which requires approval
    # before a fork PR from any outside collaborator runs a workflow.
    # issue_comment: PR comments only, from a non-bot owner, member or collaborator. This event runs
    # the base repo's copy of this file, so the author check here is a real boundary.
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issue_comment' ||
       (github.event.comment.user.type != 'Bot' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.comment.author_association)))
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 15   # backstop: kill a wedged review instead of holding the runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Pinned to a commit: this step runs third-party code on a self-hosted runner while holding
      # a provider key and write tokens. To move it, resolve a tag with
      # `gh api repos/charles8051/peanut-gallery/tags` and paste both here.
      - uses: charles8051/peanut-gallery@e4ca3862a3954519409142840080f9e62c31cbfa # v0.1.2
        with:
          config: .github/peanut-gallery.json
          pr-number: ${{ github.event.pull_request.number || github.event.issue.number }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          # Posts a `peanut-gallery` commit status on the PR head: pending while the panel
          # reviews, failure while findings are open, success when it reports none.
          commit-status: true
