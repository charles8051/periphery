CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_DEVICE_NAME="Periphery Bench"
CONFIG_BT_ID_MAX=4
CONFIG_BT_MAX_PAIRED=4
